<div class="py-8 sm:py-12 bg-slate-50 min-h-screen">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    
    <!-- Breadcrumb Navigation -->
    <nav aria-label="Breadcrumb" class="flex items-center gap-2 text-xs sm:text-sm text-slate-400 mb-6">
      <a routerLink="/" class="hover:text-blue-600 transition-colors font-medium">Home</a>
      <span>/</span>
      @if (initialCategory !== 'All Categories') {
        <a routerLink="/projects" class="hover:text-blue-600 transition-colors font-medium">Projects</a>
        <span>/</span>
        <span class="text-slate-700 font-semibold">{{ initialCategory }}</span>
      } @else {
        <span class="text-slate-700 font-semibold">Projects</span>
      }
    </nav>

    <!-- Page Header -->
    <div class="mb-6">
      <h1 class="text-2xl sm:text-3xl lg:text-4xl font-extrabold text-slate-900 tracking-tight">
        {{ pageTitle }}
      </h1>
      <p class="text-sm sm:text-base text-slate-600 mt-1.5 max-w-2xl leading-relaxed">
        Browse our complete catalog of ready-made engineering projects with verified source code, IEEE reports, and 1-on-1 setup support.
      </p>
    </div>

  </div>

  <!-- Embedded Project Catalog (full functionality) -->
  <app-project-catalog [initialCategory]="initialCategory"></app-project-catalog>
</div>
