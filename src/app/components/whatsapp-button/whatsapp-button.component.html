<div class="fixed bottom-6 right-6 z-50 flex items-center gap-3 group">
  <!-- Tooltip on hover -->
  <div class="hidden sm:flex flex-col bg-white border border-slate-200 py-1.5 px-3 rounded-lg shadow-md opacity-0 group-hover:opacity-100 transition-opacity duration-200 pointer-events-none whitespace-nowrap">
    <span class="text-xs font-bold text-slate-800">Need help choosing?</span>
    <span class="text-[11px] text-emerald-600 font-semibold">Chat with technical lead</span>
  </div>

  <!-- Floating Button -->
  <a 
    [href]="whatsappUrl" 
    target="_blank" 
    rel="noopener noreferrer" 
    id="global-whatsapp-btn"
    class="relative w-14 h-14 rounded-full bg-emerald-600 hover:bg-emerald-700 text-white flex items-center justify-center shadow-lg hover:shadow-emerald-600/30 hover:scale-105 active:scale-95 transition-all duration-200"
    aria-label="Chat on WhatsApp">
    
    <!-- Subtle pulse ring animation -->
    <span class="absolute inset-0 rounded-full bg-emerald-500 animate-ping opacity-20 pointer-events-none"></span>

    <!-- Real WhatsApp SVG icon -->
    <svg class="w-7 h-7 relative z-10" viewBox="0 0 24 24" fill="currentColor">

  </a>
</div>
